[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chatbot-evaluation"
version = "0.1.0"
description = "Reusable endpoint-driven AI evaluation with three backends and Allure reports"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
local = ["nltk>=3.9,<4", "rouge-score>=0.1.2,<0.2"]
python = ["azure-ai-evaluation>=1.8,<2", "azure-identity>=1.19,<2"]
ragas = ["ragas==0.3.2", "langchain-openai>=0.3,<0.4", "sacrebleu>=2,<3", "rouge-score>=0.1.2,<0.2"]
dev = ["pytest>=8,<9"]

[project.scripts]
ai-eval = "ai_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
ai_eval = ["*/README.md"]
